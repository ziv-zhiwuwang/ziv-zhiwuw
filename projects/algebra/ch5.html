  <style>
    :root {
      --bg: #fcfcfb;
      --surface: #ffffff;
      --ink: #1f2937;
      --muted: #5b6470;
      --line: #d9dee5;
      --line-dark: #bcc5d0;
      --accent: #1d4ed8;
      --maxw: 860px;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Georgia", "Times New Roman", serif;
      line-height: 1.72;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: min(calc(100% - 2rem), var(--maxw));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(252, 252, 251, 0.96);
      position: sticky;
      top: 0;
    }

    nav {
      width: min(calc(100% - 2rem), var(--maxw));
      margin: 0 auto;
      padding: 0.9rem 0;
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.98rem;
    }

    nav a {
      color: var(--muted);
    }

    nav a.active {
      color: var(--ink);
      font-weight: 600;
    }

    main {
      padding: 3.5rem 0 4rem;
    }

    .hero {
      max-width: 42rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3rem);
      font-weight: 600;
    }

    .subtitle {
      margin-top: 0.4rem;
      color: var(--muted);
      font-style: italic;
    }

    .back-links {
      margin-top: 1rem;
      font-size: 0.98rem;
    }

    .back-links a {
      margin-right: 1rem;
    }

    .section {
      margin-top: 2.5rem;
      border-top: 1px solid var(--line);
      padding-top: 1.6rem;
    }

    .section-header {
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .problem-list {
      display: grid;
      gap: 1rem;
    }

    .problem-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      transition: 0.15s ease;
    }

    .problem-card:hover {
      border-color: var(--line-dark);
      transform: translateY(-1px);
    }

    .problem-card a {
      font-weight: 500;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 1.2rem 0 2rem;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 820px) {
      main {
        padding-top: 2.4rem;
      }
    }
